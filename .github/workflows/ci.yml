name: CI

# Verification only. No deploy happens here (Vercel deploys on its own) and no secrets are used.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_anchor_toolchain:
        description: "Install the Solana/Anchor toolchain even if programs/ does not exist (verifies the pins)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24 = local dev version. Next 16 itself needs >= 20.9.
  NODE_VERSION: "24"
  # Never real secrets. SESSION_SECRET is only needed at request time; a dummy keeps tools that read it happy.
  SESSION_SECRET: ci-dummy-session-secret-not-a-secret-0123456789
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LayoutProps/PageProps are global helpers generated by Next 16 into .next/types.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test # vitest run

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPLAY: "1" # serve evals/recordings, no model API keys needed
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm evals

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public, non-secret values only (the defaults from .env.example).
      SOLANA_CLUSTER: devnet
      NEXT_PUBLIC_SOLANA_CLUSTER: devnet
      NEXT_PUBLIC_EXPLORER_URL: https://explorer.solana.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ---------------------------------------------------------------------------
  # Anchor program build + tests (reused by block B4).
  #  - No Anchor.toml / programs/ yet -> prints a notice and succeeds (nothing is installed).
  #  - Program present                -> installs the pinned toolchain (cached), `anchor build`, `anchor test`.
  # To reuse: add programs/<name> + Anchor.toml, nothing else. To verify the toolchain pins without a program, run
  # the workflow manually with force_anchor_toolchain=true, or push a commit whose message contains [anchor-force].
  # Tests run against a local validator that Anchor starts itself: `anchor test --validator legacy`
  # (solana-test-validator, shipped with Agave). Anchor 1.x defaults to Surfpool, which is NOT installed here,
  # hence the explicit flag. Do not use --skip-local-validator: it expects an already running validator.
  # ---------------------------------------------------------------------------
  anchor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLANA_VERSION: "4.1.2" # Agave. Same version Anchor 1.2.0 uses in its own CI.
      ANCHOR_VERSION: "1.2.0" # https://github.com/otter-sec/anchor (formerly coral-xyz/anchor)
      RUST_VERSION: "1.93.0" # host toolchain that builds the anchor CLI (avm deps need >= 1.91); SBF programs use Solana platform-tools.
    steps:
      - uses: actions/checkout@v7

      - name: Detect Anchor program
        id: detect
        env:
          FORCE_INPUT: ${{ inputs.force_anchor_toolchain }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -f Anchor.toml ] || [ -d programs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Anchor program found: building and testing."
          elif [ "$FORCE_INPUT" = "true" ] || [[ "$HEAD_MSG" == *"[anchor-force]"* ]]; then
            echo "present=force" >> "$GITHUB_OUTPUT"
            echo "No program yet, but toolchain install was forced: verifying the pinned toolchain only."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=anchor-build::No program yet (no Anchor.toml or programs/ directory). Skipping the Solana/Anchor toolchain; this job passes."
          fi

      - name: Install Rust
        if: steps.detect.outputs.present != 'false'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache Cargo and Anchor
        if: steps.detect.outputs.present != 'false'
        id: cache-anchor
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.avm
          key: anchor-${{ runner.os }}-rust${{ env.RUST_VERSION }}-anchor${{ env.ANCHOR_VERSION }}

      - name: Cache Solana toolchain
        if: steps.detect.outputs.present != 'false'
        id: cache-solana
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI (Agave)
        if: steps.detect.outputs.present != 'false' && steps.cache-solana.outputs.cache-hit != 'true'
        run: curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh

      - name: Install Anchor CLI via avm
        if: steps.detect.outputs.present != 'false' && steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/otter-sec/anchor --tag "v${ANCHOR_VERSION}" avm --locked --force
          avm install "${ANCHOR_VERSION}"

      - name: Activate toolchain
        if: steps.detect.outputs.present != 'false'
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          avm use "${ANCHOR_VERSION}"
          # Capture first: `cmd | grep -q` can fail with SIGPIPE under pipefail.
          SOLANA_OUT="$(solana --version)"
          ANCHOR_OUT="$(anchor --version 2>&1)"
          echo "$SOLANA_OUT"
          echo "$ANCHOR_OUT"
          # Fail if what runs is not what is pinned.
          [[ "$SOLANA_OUT" == *"solana-cli ${SOLANA_VERSION} "* ]]
          [[ "$ANCHOR_OUT" == *"anchor-cli ${ANCHOR_VERSION}"* ]]

      - name: Set up pnpm (for the TypeScript tests)
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install JS dependencies
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate a throwaway keypair (CI only, never committed)
        if: steps.detect.outputs.present == 'true'
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"

      - name: anchor build
        if: steps.detect.outputs.present == 'true'
        run: anchor build

      - name: anchor test (local validator)
        if: steps.detect.outputs.present == 'true'
        run: anchor test --validator legacy

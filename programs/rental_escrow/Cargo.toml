[package]
name = "rental_escrow"
version = "0.1.0"
description = "Rental escrow: lease terms, deposit vault, rent with on-chain discounts, 2-of-3 deposit release (devnet only)"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "rental_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
# sha256 for the release terms hash: syscall on-chain, the `sha2` crate on the host (unit tests, IDL build).
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
